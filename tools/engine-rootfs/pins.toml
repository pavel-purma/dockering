# Single source of truth for the engine root filesystems (REL-088, REL-089, ENG-152).
#
# Read by: build.sh (through pins.py), `cargo xtask engine-rootfs-pin-check`, and mirrored by
# the pin table of the app (crates/dk-wsl/src/setup/pins.rs, which must contain every published
# asset's url, size and sha256 literally; the pin check compares them).
#
# [build] and [images.*.arch.*] base_* describe how an image is BUILT. [images.*.arch.*.asset]
# describes what the release [release].tag PUBLISHED, which is what the app downloads and pins.
#
# Flipping an asset from "unpublished" to "published" (docs/engine-rootfs.md, "Cutting a release"):
#   1. Dispatch engine-rootfs.yml with tag rootfs-<n> and publish = true.
#   2. Copy the TOML printed in the publish job's summary (`pins.py render`) over the four
#      [images.*.arch.*.asset] tables here and set [release] tag = "rootfs-<n>".
#   3. Fill the same four url/size/sha256 triples into the Rust pin table, in the same PR.
#   4. In .github/workflows/ci.yml and release.yml drop `--allow-unpublished`
#      (the pin check then refuses any cell that is still unpublished).
# Until step 4 an "unpublished" cell means: the app has no pin for it and omits that choice (A13).

schema = 1
repo = "pavel-purma/dockering"

[release]
# The release whose assets the [images.*.arch.*.asset] tables describe.
tag = "rootfs-1"
tag_template = "rootfs-<n>"

[build]
# Fixed on purpose: files newer than this are clamped to it, so rebuilds with the same inputs give
# the same tar. Move it forward (a new date) when you cut a new rootfs-<n>. 2026-10-21 00:00:00 UTC.
source_date_epoch = 1792540800
docker_apt_url = "https://download.docker.com/linux/ubuntu"
docker_apt_key_url = "https://download.docker.com/linux/ubuntu/gpg"
# Docker's package signing key (primary key fingerprint), checked before the key is trusted.
docker_apt_key_fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"

# ---------------------------------------------------------------------------------------------
# Alpine: minirootfs + packages from Alpine's repositories (v3.24). Alpine drops old package
# builds, so versions are RECORDED in /etc/dockering-engine-manifest.txt, not pinned. The base
# tarball is pinned by SHA-256.
# ---------------------------------------------------------------------------------------------
[images.alpine]
label = "Alpine"
apk_packages = ["docker", "docker-engine", "containerd", "runc", "socat", "iptables", "ip6tables"]
# Informational (spike W-3, 2026-10-21). A rebuild that resolves other versions is fine.
reference_versions = [
  "docker-29.8.2-r1",
  "docker-engine-29.8.2-r1",
  "docker-cli-29.8.2-r1",
  "docker-cli-buildx-0.34.1-r2",
  "containerd-2.3.7-r0",
  "runc-1.4.3-r2",
  "socat-1.8.1.3-r0",
  "iptables-1.8.13-r0",
]
# apk upgrade after the install, so a monthly rebuild also picks up base-system security fixes.
upgrade_base = true

[images.alpine.arch.x86_64]
base_url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.2-x86_64.tar.gz"
base_size = 3701382
base_sha256 = "c5ca053cfe1d85c5b96dff8b9bc57045f7f184a30ffb6b65776409ca90388677"

[images.alpine.arch.x86_64.asset]
status = "unpublished"
name = "dockering-engine-alpine-x86_64.tar.xz"
url = "https://github.com/pavel-purma/dockering/releases/download/rootfs-1/dockering-engine-alpine-x86_64.tar.xz"
size = 0
sha256 = ""

[images.alpine.arch.aarch64]
base_url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.2-aarch64.tar.gz"
base_size = 4028030
base_sha256 = "9bf70a7f18ea44094cbb5f70c58f9af129c8214745743db0e68e5502cc2ce773"

[images.alpine.arch.aarch64.asset]
status = "unpublished"
name = "dockering-engine-alpine-aarch64.tar.xz"
url = "https://github.com/pavel-purma/dockering/releases/download/rootfs-1/dockering-engine-alpine-aarch64.tar.xz"
size = 0
sha256 = ""

# ---------------------------------------------------------------------------------------------
# Ubuntu: Canonical's 26.04.1 LTS WSL root filesystem + docker-ce, docker-ce-cli and containerd.io
# from Docker's apt repository at EXACT versions (Docker keeps old builds in its pool).
# ---------------------------------------------------------------------------------------------
[images.ubuntu]
label = "Ubuntu"
suite = "resolute"
upgrade_base = true

[images.ubuntu.apt_packages]
docker-ce = "5:29.9.2-1~ubuntu.26.04~resolute"
docker-ce-cli = "5:29.9.2-1~ubuntu.26.04~resolute"
