# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
# Template (REL-040). Placeholders: {{VERSION}} (no leading "v"), {{X64_SHA256}}, {{ARM64_SHA256}}
# (uppercase hex SHA-256 of the signed Dockering-Setup-*.exe; see SHA256SUMS in the release).
# Inno Setup installer (REL-020/021): per-user by default (/CURRENTUSER), all users with /ALLUSERS.
# ProductCode is the Inno uninstall key: AppId in packaging/windows/dockering.iss plus "_is1". winget matches the installed
# Add/Remove Programs entry to this package by it, so `winget upgrade` and `winget list` see Dockering installs made by hand.
# RequireExplicitUpgrade is deliberately not set (REL-042).

PackageIdentifier: Dockering.Dockering
PackageVersion: "{{VERSION}}"
InstallerType: inno
UpgradeBehavior: install
MinimumOSVersion: 10.0.19045.0
ProductCode: "{8C3F4E2A-6B1D-4E7A-9F2C-5D8B1A3E7C64}_is1"
AppsAndFeaturesEntries:
  - DisplayName: Dockering
    Publisher: Dockering contributors
    ProductCode: "{8C3F4E2A-6B1D-4E7A-9F2C-5D8B1A3E7C64}_is1"
Installers:
  - Architecture: x64
    Scope: user
    InstallerUrl: https://github.com/pavel-purma/dockering/releases/download/v{{VERSION}}/Dockering-Setup-x64.exe
    InstallerSha256: "{{X64_SHA256}}"
    InstallerSwitches:
      Custom: /CURRENTUSER
  - Architecture: x64
    Scope: machine
    InstallerUrl: https://github.com/pavel-purma/dockering/releases/download/v{{VERSION}}/Dockering-Setup-x64.exe
    InstallerSha256: "{{X64_SHA256}}"
    InstallerSwitches:
      Custom: /ALLUSERS
  - Architecture: arm64
    Scope: user
    InstallerUrl: https://github.com/pavel-purma/dockering/releases/download/v{{VERSION}}/Dockering-Setup-arm64.exe
    InstallerSha256: "{{ARM64_SHA256}}"
    InstallerSwitches:
      Custom: /CURRENTUSER
  - Architecture: arm64
    Scope: machine
    InstallerUrl: https://github.com/pavel-purma/dockering/releases/download/v{{VERSION}}/Dockering-Setup-arm64.exe
    InstallerSha256: "{{ARM64_SHA256}}"
    InstallerSwitches:
      Custom: /ALLUSERS
ManifestType: installer
ManifestVersion: 1.12.0
