[package]
name = "dockering"
description = "Dockering desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dockering"
path = "src/lib.rs"

[[bin]]
name = "dockering"
path = "src/main.rs"

[features]
default = ["demo"]
# `--demo`: run the full UI against an in-memory FakeEngine (no Docker needed).
demo = ["dk-core/test-support"]

[dependencies]
dk-core.workspace = true
dk-hub.workspace = true
dk-terminal.workspace = true
# `tree-sitter`: JSON syntax highlighting in the Inspect tabs (spec 30 §1 "Raw JSON").
gpui-kit = { workspace = true, features = ["tree-sitter"] }
futures.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
dk-core = { workspace = true, features = ["test-support"] }
dk-hub = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
