[package]
name = "dk-update"
description = "Dockering updater manifest, verification, download, and apply primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
test-support = []

[dependencies]
reqwest.workspace = true
minisign-verify.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Threading", "Win32_System_Registry"] }

[dev-dependencies]
minisign.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
proptest.workspace = true

[lints.rust]
# Win32 Authenticode FFI is confined to `authenticode`; all other modules deny unsafe code.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
