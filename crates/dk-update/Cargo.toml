[package]
name = "dk-update"
description = "Dockering updater manifest, verification, download, and apply primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
test-support = []
# REL-086 test seam: `GithubSource::with_base` points every fetch at a loopback server. Never in
# default features and never in a shipped build; `dk-hub` and `dockering` forward it.
update-e2e = []

[dependencies]
reqwest.workspace = true
minisign-verify.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The AppImage strategy marks inherited descriptors close-on-exec in a child (apply/appimage/fds.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell"] }

[dev-dependencies]
minisign.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
proptest.workspace = true

[lints.rust]
# Win32 Authenticode FFI is confined to `authenticode`; all other modules deny unsafe code.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
