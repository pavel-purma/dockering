# Release on tag v* (REL-010…013, REL-030…034, UPD-002/003; docs/spec/features/distribution.md).
#
# The tag is normally pushed by the `/release` skill (REL-018) once the release PR has merged; a
# maintainer can also push it by hand (docs/release.md). This workflow builds, signs, attests, and
# uploads every asset to a DRAFT GitHub Release. Publishing the draft (after verification) is what
# makes a version visible to users, the in-app updater, and winget.
#
# Branch dispatches build all six targets and a complete review artifact; they never create a
# release or tag. Tag runs create a DRAFT only. Unsigned mode explicitly disables signing and
# the updater, even when credentials are configured (REL-016/017).
# Secrets live only in the GitHub environment `release` (restricted to main and v* refs).
#
# Repository variables:
#   PUBLIC_RELEASES   'true' → signed channel; tags are signed          REL-031, UPD-005
#   WINDOWS_SIGNING   signpath | azure | none (default none)            REL-031
#   MACOS_SIGNING     apple | none (default none), independent of Windows   REL-034
#   SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG                      (signpath)
#   WINDOWS_SIGNER_SUBJECT  expected Authenticode subject DN; required on signed tags   REL-032
# Secrets (environment `release`):
#   SIGNPATH_API_TOKEN                                                   (signpath)
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE    (azure)
#   UPDATE_SIGNING_KEY (+ optional UPDATE_SIGNING_KEY_PASSWORD)          UPD-003 manifest signature
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8                    (macOS, MACOS_SIGNING=apple)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      unsigned:
        description: Build unsigned files without the updater (branch runs produce review artifacts only)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98"
  PACKAGER_VERSION: "0.11.8"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: verify release inputs
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      unsigned: ${{ steps.v.outputs.unsigned }}
      macos_signed: ${{ steps.v.outputs.macos_signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Verify version, changelog, ref and release mode (REL-011/016)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_UNSIGNED: ${{ inputs.unsigned }}
          PUBLIC_RELEASES: ${{ vars.PUBLIC_RELEASES }}
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING || 'none' }}
          MACOS_SIGNING: ${{ vars.MACOS_SIGNING || 'none' }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
          HAS_AZURE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CERT_PROFILE != '' }}
          HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
          HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          version=$(python3 - <<'PY'
          import re, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['workspace']['package']['version']
          number = r'(?:0|[1-9][0-9]*)'
          identifier = r'(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if not re.fullmatch(rf'{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?', version):
              raise SystemExit(f'::error::invalid workspace release version {version!r}')
          print(version)
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # Match the literal heading: version dots must not behave as regex wildcards.
          awk -v h="## [$version]" '$0 == h || index($0, h " - ") == 1 { found=1 } END { exit !found }' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          unsigned=true
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            unsigned="$REQUESTED_UNSIGNED"
          elif [[ "$PUBLIC_RELEASES" == true ]]; then
            unsigned=false
          fi
          [[ "$unsigned" == true || "$unsigned" == false ]] \
            || { echo "::error::unsigned must be true or false"; exit 1; }
          echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo "::error::tag $GITHUB_REF_NAME != workspace version $version"; exit 1; }
            # The tag must be on main or a release/* branch (REL-010).
            git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/(main$|release/)' \
              || { echo "::error::$GITHUB_REF_NAME is not on main or release/*"; exit 1; }
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/* ]]; then
            echo "::notice::branch rehearsal; version $version; no GitHub Release will be created"
          else
            echo "::error::expected a v* tag or a workflow_dispatch branch"
            exit 1
          fi
          macos_signed=false
          if [[ "$unsigned" == false ]]; then
            case "$WINDOWS_SIGNING" in
              azure) [[ "$HAS_AZURE" == true ]] || { echo "::error::Azure signing configuration is incomplete"; exit 1; } ;;
              signpath) [[ "$HAS_SIGNPATH" == true ]] || { echo "::error::SignPath signing configuration is incomplete"; exit 1; } ;;
              *) echo "::error::signed mode requires WINDOWS_SIGNING=azure or signpath"; exit 1 ;;
            esac
            case "$MACOS_SIGNING" in
              apple)
                [[ "$HAS_APPLE" == true ]] || { echo "::error::macOS signing/notarisation configuration is incomplete"; exit 1; }
                macos_signed=true ;;
              none) ;;
              *) echo "::error::MACOS_SIGNING must be apple or none"; exit 1 ;;
            esac
            [[ "$HAS_UPDATE_KEY" == true ]] || { echo "::error::signed mode requires UPDATE_SIGNING_KEY"; exit 1; }
            python3 - <<'PY'
          import re
          source = open('crates/dk-update/src/keys.rs', encoding='utf-8').read()
          match = re.search(r'PUBLIC_KEYS[^=]*=\s*&\[(.*?)\];', source, re.S)
          body = re.sub(r'(?m)^\s*//.*$', '', match.group(1)) if match else ''
          if not re.search(r'"[^"]+"', body):
              raise SystemExit('::error::signed mode requires a public key in crates/dk-update/src/keys.rs (UPD-003)')
          PY
            if [[ "$GITHUB_REF" == refs/tags/v* && -z "$WINDOWS_SIGNER_SUBJECT" ]]; then
              echo "::error::signed tags require the variable WINDOWS_SIGNER_SUBJECT (REL-032)"
              exit 1
            fi
          fi
          echo "macos_signed=$macos_signed" >> "$GITHUB_OUTPUT"
      - name: Refuse to change an already published release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/existing-release.json" \
            --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$status" in
            200) python3 - "$RUNNER_TEMP/existing-release.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              release = json.load(f)
          if release.get('draft') is not True:
              raise SystemExit('::error::this tag already has a published release; use a new version')
          PY
            ;;
            404) echo '::notice::no existing release for this tag' ;;
            *) echo "::error::could not inspect existing release (HTTP $status)"; exit 1 ;;
          esac

  package:
    name: package (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, arch: x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, arch: arm64 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    env:
      TARGET: ${{ matrix.target }}
      SIGNING: ${{ vars.WINDOWS_SIGNING || 'none' }}
      # Only "is it configured" booleans at job level: secret values never reach build steps
      # (cargo build scripts, cargo install, …), only the steps that use them (NFR-020, REL-013).
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux prerequisites (GPUI Kit)
        if: runner.os == 'Linux'
        run: bash scripts/bootstrap.sh
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-03
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: release-${{ matrix.target }}
      - name: Install cargo-packager
        if: runner.os != 'Windows'
        shell: bash
        run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - name: Inno Setup (REL-020)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }

      - name: cargo build --release
        shell: bash
        run: |
          features=()
          # UPD-005/REL-016: unsigned builds never contain the updater.
          if [[ "${{ needs.verify.outputs.unsigned }}" != true && "${{ vars.PUBLIC_RELEASES }}" == true ]]; then features=(--features updater); fi
          cargo build --release --locked -p dockering --target "$TARGET" "${features[@]}"

      # --- Windows, stage 1: sign dockering.exe before it goes into the installer and zip ---
      - name: Sign dockering.exe (Azure Artifact Signing)
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING == 'azure' && env.HAS_AZURE == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\dockering.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload unsigned dockering.exe for SignPath
        id: unsigned-exe
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING == 'signpath' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dockering.exe
          if-no-files-found: error
      - name: Sign dockering.exe (SignPath)
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING == 'signpath' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/${{ matrix.target }}/release
          parameters: |
            version: "${{ needs.verify.outputs.version }}"

      # --- macOS: cargo-packager signs and notarises the .app when the identity is set (REL-034) ---
      - name: Prepare macOS signing
        if: needs.verify.outputs.macos_signed == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "DOCKERING_MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: cargo xtask package
        if: runner.os != 'macOS'
        run: cargo xtask package --target ${{ matrix.target }}
      - name: Package macOS (bounded retry for busy DMG unmount)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ needs.verify.outputs.macos_signed == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.verify.outputs.macos_signed == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ needs.verify.outputs.macos_signed == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ needs.verify.outputs.macos_signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: bash scripts/package-macos.sh "$TARGET"

      # --- Windows, stage 2: sign the installer ---
      - name: Sign the installer (Azure Artifact Signing)
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING == 'azure' && env.HAS_AZURE == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\target\dist\${{ matrix.target }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload unsigned installer for SignPath
        id: unsigned-setup
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING == 'signpath' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup-${{ matrix.target }}
          path: target/dist/${{ matrix.target }}/Dockering-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING == 'signpath' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/dist/${{ matrix.target }}
          parameters: |
            version: "${{ needs.verify.outputs.version }}"

      - name: Verify Windows signatures (REL-030, REL-032)
        id: verify-signatures
        if: needs.verify.outputs.unsigned != 'true' && runner.os == 'Windows' && env.SIGNING != 'none'
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          Add-Type -AssemblyName System.Security.Cryptography.Pkcs
          function Get-DigestOid([string] $Path) {
            $b = [IO.File]::ReadAllBytes($Path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $dir = $pe + 24 + $(if ([BitConverter]::ToUInt16($b, $pe + 24) -eq 0x20B) { 112 } else { 96 })
            $off = [BitConverter]::ToUInt32($b, $dir + 32)
            $len = [BitConverter]::ToUInt32($b, $off)
            $cms = [Security.Cryptography.Pkcs.SignedCms]::new()
            $cms.Decode([byte[]]$b[($off + 8)..($off + $len - 1)])
            $cms.SignerInfos[0].DigestAlgorithm.Value
          }
          $files = @("target\${{ matrix.target }}\release\dockering.exe") + (Get-ChildItem "target\dist\${{ matrix.target }}\Dockering-Setup-*.exe").FullName
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$f signature: $($sig.Status)"; exit 1 }
            if (-not $sig.TimeStamperCertificate) { Write-Host "::error::$f has no RFC 3161 timestamp"; exit 1 }
            $oid = Get-DigestOid $f
            if ($oid -ne '2.16.840.1.101.3.4.2.1') { Write-Host "::error::$f digest is $oid, expected SHA-256"; exit 1 }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }
          $subjects = @($files | ForEach-Object { (Get-AuthenticodeSignature $_).SignerCertificate.Subject } | Sort-Object -Unique)
          if ($subjects.Count -ne 1) { Write-Host "::error::signers differ: $subjects"; exit 1 }
          # REL-032: the signer must be the expected publisher (repo variable WINDOWS_SIGNER_SUBJECT).
          if ($env:EXPECTED_SIGNER -and $subjects[0] -ne $env:EXPECTED_SIGNER) { Write-Host "::error::signer '$($subjects[0])' is not '$env:EXPECTED_SIGNER'"; exit 1 }

      - name: Installer smoke test (REL-014)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "target\dist\${{ matrix.target }}\Dockering-Setup-${{ matrix.arch }}.exe"
          pwsh -NoProfile -File scripts/installer-smoke.ps1 -Setup $setup -Version "${{ needs.verify.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/installer-smoke.ps1 -Setup $setup -Version "${{ needs.verify.outputs.version }}" -AllUsers

      - name: Sign, notarise and staple the DMG
        if: needs.verify.outputs.macos_signed == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in target/dist/"$TARGET"/*.dmg; do
            codesign --force --timestamp --sign "$DOCKERING_MACOS_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --wait \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "$dmg"
          done

      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      # Only a successful signature check counts (REL-031): a skipped signing step leaves "false".
      - name: Record whether Windows binaries are signed
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERIFIED: ${{ steps.verify-signatures.outcome }}
        run: |
          signed=false
          if [[ "$VERIFIED" == success ]]; then signed=true; fi
          echo "$signed" > "target/dist/$TARGET/.signed"
      - name: Verify every package for this target (REL-017)
        run: cargo xtask verify-assets --assets target/dist/${{ matrix.target }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.target }}
          path: |
            target/dist/${{ matrix.target }}/Dockering-*.exe
            target/dist/${{ matrix.target }}/Dockering-*.zip
            target/dist/${{ matrix.target }}/Dockering-*.dmg
            target/dist/${{ matrix.target }}/Dockering-*.AppImage
            target/dist/${{ matrix.target }}/Dockering-*.deb
            target/dist/${{ matrix.target }}/Dockering-*.tar.gz
            target/dist/${{ matrix.target }}/.signed
          include-hidden-files: true
          if-no-files-found: error

  assemble:
    name: assemble release review artifacts
    needs: [verify, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-03
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: artifacts
      - name: Collect assets
        shell: bash
        run: |
          mkdir -p dist
          while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            [[ ! -e "dist/$name" ]] || { echo "::error::duplicate release asset $name"; exit 1; }
            cp "$asset" "dist/$name"
          done < <(find artifacts -type f -name 'Dockering-*' -print0)
      # PUBLIC_RELEASES denotes the signed channel, independently of repository visibility.
      - name: Stable public releases must be signed (REL-031)
        if: startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.unsigned != 'true' && needs.verify.outputs.prerelease != 'true' && vars.PUBLIC_RELEASES == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          markers=(artifacts/release-package-*windows*/.signed)
          [[ ${#markers[@]} -eq 2 ]] || { echo "::error::expected 2 Windows signing markers, found ${#markers[@]}"; exit 1; }
          for f in "${markers[@]}"; do
            [[ "$(cat "$f")" == true ]] || { echo "::error::unsigned Windows build ($f) on a stable tag; set WINDOWS_SIGNING and its secrets, or tag a pre-release"; exit 1; }
          done
      - name: Build xtask (no secrets in this step)
        run: cargo build --locked -p xtask
      - name: Verify all twelve distribution assets (REL-017)
        run: target/debug/xtask verify-assets --assets dist
      - name: Update manifest (UPD-002)
        run: target/debug/xtask update-manifest --assets dist --version "${{ needs.verify.outputs.version }}" --repo "$GITHUB_REPOSITORY"
      - name: Sign the update manifest (UPD-003)
        if: needs.verify.outputs.unsigned != 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
        run: |
          [[ -n "$UPDATE_SIGNING_KEY" ]] || { echo "::error::signed mode requires UPDATE_SIGNING_KEY"; exit 1; }
          target/debug/xtask sign-manifest dist/dockering-update.json
      - name: Manifest signature verifies against the app's public keys (UPD-003)
        if: needs.verify.outputs.unsigned != 'true'
        run: target/debug/xtask verify-manifest --assets dist
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          UNSIGNED: ${{ needs.verify.outputs.unsigned }}
          MACOS_SIGNED: ${{ needs.verify.outputs.macos_signed }}
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING || 'none' }}
          PUBLIC_REPOSITORY: ${{ github.event.repository.private != true }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] - ") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          [[ -s dist/RELEASE_NOTES.md ]] || { echo "::error::release changelog section is empty"; exit 1; }
          policy="https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
          {
            echo
            echo "---"
            if [[ "$UNSIGNED" == true ]]; then
              echo "**Unsigned release:** Windows files are not Authenticode-signed; macOS files are not Developer ID-signed or notarised. Windows SmartScreen and macOS Gatekeeper may warn or block launch. Automatic updates are disabled in these builds; the update manifest has no signature."
            else
              echo "**Signed release:** \`dockering.exe\` and the Windows installers are Authenticode-signed. See the [Code signing policy]($policy)."
              if [[ "$WINDOWS_SIGNING" == signpath ]]; then
                echo "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)"
              fi
              if [[ "$MACOS_SIGNED" != true ]]; then
                echo "macOS files are not Developer ID-signed or notarised; Gatekeeper may warn or block launch."
              fi
            fi
            if [[ "$PUBLIC_REPOSITORY" == true ]]; then
              echo "**Verify a download:** \`gh attestation verify <file> -R $GITHUB_REPOSITORY\` · checksums in \`SHA256SUMS\`."
            else
              echo "**Verify a download:** checksums in \`SHA256SUMS\`. Build provenance is unavailable for this private repository."
            fi
          } >> dist/RELEASE_NOTES.md
      - name: Checksums
        run: target/debug/xtask checksums dist
      # Attestations in private repositories need GitHub Enterprise Cloud. Repository visibility
      # is independent of code signing: public unsigned releases also get provenance.
      - name: Build provenance (REL-013)
        if: github.event.repository.private != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload complete release review artifact (REL-016/017)
        uses: actions/upload-artifact@v7
        with:
          name: release-review-${{ needs.verify.outputs.version }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: create draft GitHub Release
    needs: [verify, assemble]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-review-${{ needs.verify.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: dist/RELEASE_NOTES.md
          draft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
