# Release on tag v* (REL-010…013, REL-030…032, UPD-002/003; docs/spec/features/distribution.md).
#
# The tag is normally created by release-plz (release-plz.yml) when a release PR merges; a
# maintainer can also push it by hand. This workflow builds, signs, attests, and uploads every
# asset to a DRAFT GitHub Release. Publishing the draft (by hand, after a smoke test) is what
# makes a version visible to users, the in-app updater, and winget.
#
# Signing secrets live only in the GitHub environment `release` (required reviewers). Every step
# is skipped when its secrets are absent, which gives an unsigned build. An unsigned STABLE tag
# fails the publish job (REL-031); pre-releases (`-alpha.N`, `-rc.N`, …) may be unsigned.
#
# Repository variables:
#   WINDOWS_SIGNING   signpath | azure | none (default none)          REL-031
#   PUBLIC_RELEASES   'true' → build with the in-app updater          UPD-005
#   SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG                    (signpath)
# Secrets (environment `release`):
#   SIGNPATH_API_TOKEN                                                 (signpath)
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE  (azure)
#   UPDATE_SIGNING_KEY (+ optional UPDATE_SIGNING_KEY_PASSWORD)        UPD-003 manifest signature
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8                  (macOS)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98"
  PACKAGER_VERSION: "0.11.8"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Tag matches the workspace version and CHANGELOG.md (REL-011)
        shell: bash
        run: |
          version=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::notice::not a tag build (workflow_dispatch); version $version"
            exit 0
          fi
          [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo "::error::tag $GITHUB_REF_NAME != workspace version $version"; exit 1; }
          grep -qE "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          # The tag must be on main or a release/* branch (REL-010).
          git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/(main|release/)' \
            || { echo "::error::$GITHUB_REF_NAME is not on main or release/*"; exit 1; }

  package:
    name: package (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    env:
      TARGET: ${{ matrix.target }}
      SIGNING: ${{ vars.WINDOWS_SIGNING || 'none' }}
      # Mapped here so `if: env.X != ''` can gate steps. Values stay masked in logs.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux prerequisites (GPUI Kit)
        if: runner.os == 'Linux'
        run: bash scripts/bootstrap.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install cargo-packager
        if: runner.os != 'Windows'
        shell: bash
        run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - name: Inno Setup (REL-020)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }

      - name: cargo build --release
        shell: bash
        run: |
          features=()
          # UPD-005: only public releases contain the updater.
          if [[ "${{ vars.PUBLIC_RELEASES }}" == "true" ]]; then features=(--features updater); fi
          cargo build --release --locked -p dockering --target "$TARGET" "${features[@]}"

      # --- Windows, stage 1: sign dockering.exe before it goes into the installer and zip ---
      - name: Sign dockering.exe (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.SIGNING == 'azure' && env.AZURE_CLIENT_ID != ''
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\dockering.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload unsigned dockering.exe for SignPath
        id: unsigned-exe
        if: runner.os == 'Windows' && env.SIGNING == 'signpath' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dockering.exe
          if-no-files-found: error
      - name: Sign dockering.exe (SignPath)
        if: runner.os == 'Windows' && env.SIGNING == 'signpath' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/${{ matrix.target }}/release

      # --- macOS: cargo-packager signs and notarises the .app when the identity is set ---
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "DOCKERING_MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: cargo xtask package
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo xtask package --target ${{ matrix.target }}

      # --- Windows, stage 2: sign the installer ---
      - name: Sign the installer (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.SIGNING == 'azure' && env.AZURE_CLIENT_ID != ''
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\target\dist\${{ matrix.target }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload unsigned installer for SignPath
        id: unsigned-setup
        if: runner.os == 'Windows' && env.SIGNING == 'signpath' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup-${{ matrix.target }}
          path: target/dist/${{ matrix.target }}/Dockering-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && env.SIGNING == 'signpath' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/dist/${{ matrix.target }}

      - name: Verify Windows signatures (REL-032)
        id: verify-signatures
        if: runner.os == 'Windows' && env.SIGNING != 'none'
        shell: pwsh
        run: |
          $files = @("target\${{ matrix.target }}\release\dockering.exe") + (Get-ChildItem "target\dist\${{ matrix.target }}\Dockering-Setup-*.exe").FullName
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$f signature: $($sig.Status)"; exit 1 }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }
          $subjects = $files | ForEach-Object { (Get-AuthenticodeSignature $_).SignerCertificate.Subject } | Sort-Object -Unique
          if ($subjects.Count -ne 1) { Write-Host "::error::signers differ: $subjects"; exit 1 }

      - name: Installer smoke test (REL-014)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/installer-smoke.ps1 -Setup target\dist\${{ matrix.target }}\Dockering-Setup-x64.exe -Version "${{ needs.verify.outputs.version }}"

      - name: Sign, notarise and staple the DMG
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_API_KEY != ''
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in target/dist/"$TARGET"/*.dmg; do
            codesign --force --timestamp --sign "$DOCKERING_MACOS_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --wait \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "$dmg"
          done

      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      # Only a successful signature check counts (REL-031): a skipped signing step leaves "false".
      - name: Record whether Windows binaries are signed
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERIFIED: ${{ steps.verify-signatures.outcome }}
        run: |
          signed=false
          if [[ "$VERIFIED" == success ]]; then signed=true; fi
          echo "$signed" > "target/dist/$TARGET/.signed"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            target/dist/${{ matrix.target }}/Dockering-*
            target/dist/${{ matrix.target }}/.signed
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: publish draft GitHub Release
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: Collect assets
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -name 'Dockering-*' -exec cp {} dist/ \;
          ls -la dist
      - name: Stable releases must be signed (REL-031)
        if: needs.verify.outputs.prerelease != 'true'
        shell: bash
        run: |
          shopt -s nullglob
          markers=(artifacts/release-*windows*/.signed)
          [[ ${#markers[@]} -eq 2 ]] || { echo "::error::expected 2 Windows signing markers, found ${#markers[@]}"; exit 1; }
          for f in "${markers[@]}"; do
            [[ "$(cat "$f")" == true ]] || { echo "::error::unsigned Windows build ($f) on a stable tag; set WINDOWS_SIGNING and its secrets, or tag a pre-release"; exit 1; }
          done
      - name: Update manifest (UPD-002) + minisign (UPD-003)
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
        run: |
          cargo xtask update-manifest --assets dist --version "${{ needs.verify.outputs.version }}" --repo "$GITHUB_REPOSITORY"
          if [[ -n "$UPDATE_SIGNING_KEY" ]]; then
            cargo xtask sign-manifest dist/dockering-update.json
          else
            echo "::warning::UPDATE_SIGNING_KEY is not set; the update manifest is unsigned and installed apps will ignore it"
          fi
          cargo xtask checksums dist
      - name: Build provenance (REL-013)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "---"
            echo "**Verify a download:** \`gh attestation verify <file> -R $GITHUB_REPOSITORY\` · checksums in \`SHA256SUMS\`."
          } >> "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          draft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
