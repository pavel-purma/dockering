# PR titles must be conventional commits (REL-010): main uses squash merges, so the PR title becomes
# the commit message that `cargo xtask release-plan` classifies to compute the version and changelog (REL-011).
# Keep the scopes in sync with AGENTS.md "Commit style".
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional commit title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            style
            build
            revert
          scopes: |
            core
            hub
            docker
            wsl
            wslc
            windows
            terminal
            ui
            containers
            images
            volumes
            networks
            settings
            keyboard
            ci
            docs
            spec
            release
            update
            installer
            deps
            repo
          requireScope: false
