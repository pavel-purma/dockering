# CI per docs/spec/50-build-and-release.md (NFR-001, NFR-040, REL-002, REL-003).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with rust-toolchain.toml (checked in the lint job).
  RUST_TOOLCHAIN: "1.98"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debuginfo in dev/test builds: linking the ~20 GPUI test binaries with full debuginfo is slow
  # (PDBs on Windows) and bloats the caches. Panics still report file:line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: short

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain pin matches rust-toolchain.toml
        run: grep -Eq "^channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
      - name: actionlint (workflows)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Linux smoke scripts, shellcheck and Python syntax (REL-070)
        run: |
          shellcheck scripts/linux-smoke/*.sh
          python3 -B -c 'import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"), sys.argv[1])' scripts/linux-smoke/atspi.py
      - name: Script tests (macOS packaging recovery REL-017, release verify step REL-031…034, Linux smoke scripts REL-071)
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Release verifier parses (REL-018)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/verify-release.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host "::error file=scripts/verify-release.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }; exit 1 }
      - name: Linux prerequisites (GPUI Kit)
        run: bash scripts/bootstrap.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: NFR-001 blocking-call check
        run: cargo xtask check-blocking
      - name: Generated icons are up to date (REL-050)
        run: cargo xtask icons --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (updater feature, UPD-005)
        run: cargo clippy --workspace --all-targets --locked --features dockering/updater -- -D warnings
      - name: cargo deny (licences, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: ${{ env.RUST_TOOLCHAIN }}
          command: check
          command-arguments: advisories bans licenses sources
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2 # match the version that generated the committed file
      - name: THIRD_PARTY_LICENSES.html is up to date (REL-002)
        run: |
          cargo about generate --locked about.hbs -o "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          if ! diff -q --strip-trailing-cr THIRD_PARTY_LICENSES.html "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"; then
            echo "::error file=THIRD_PARTY_LICENSES.html::Stale third-party notices. Run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: macOS packaging recovery under native Bash 3.2 (REL-017)
        if: runner.os == 'macOS'
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PACKAGE_MACOS_TEST_BASH: /bin/bash
        run: |
          /bin/bash --version
          /bin/bash -n scripts/package-macos.sh
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Linux prerequisites (GPUI Kit)
        if: runner.os == 'Linux'
        run: bash scripts/bootstrap.sh
      # Windows: build on a trusted ReFS Dev Drive, so Defender doesn't scan every object file and
      # PDB as it's written. Mounted beside the checkout (not at target/, which would make the
      # volume root the cached directory).
      - name: Dev Drive for the target dir (Windows)
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 25GB
          mount-path: ../dev-drive
          trusted-dev-drive: true
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.os == 'Windows' && '. -> ../dev-drive/target' || '.' }}
          # Save the build even when a test fails: a failing test on main otherwise leaves the next
          # run (and every PR) to compile from scratch.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # The lint job lints Linux. This step covers cfg(windows)/cfg(macos) code (dk-wsl, WSLC COM).
      - name: cargo clippy (platform cfg)
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --locked
      - name: cargo nextest (updater feature)
        run: cargo nextest run -p dk-update -p dk-hub --features dk-hub/updater --locked
      - name: doc tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc --locked

  integration-docker:
    name: integration-docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Docker is available
        run: docker version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (real dockerd)
        # --no-tests=warn: integration tests land with the engine work (M2); drop it then.
        run: cargo nextest run -p dk-engine-docker --features it --locked --no-tests=warn

  # REL-014: on Windows the job also builds the Inno installer and smoke-tests it on every push and
  # PR (one release build per target, not two). Unsigned; signing happens only in release.yml.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, arch: x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, arch: arm64 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
      - name: Linux prerequisites (GPUI Kit)
        if: runner.os == 'Linux'
        run: bash scripts/bootstrap.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build --release
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      # Packaging smoke test: Windows always (the installer, REL-014); elsewhere on main only (PRs only
      # build, to keep them fast).
      - name: Install cargo-packager
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        shell: bash
        run: cargo packager --version 2>/dev/null || cargo install cargo-packager --locked --version 0.11.8
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }
      - name: cargo xtask package
        if: runner.os != 'macOS' && (github.event_name != 'pull_request' || runner.os == 'Windows')
        run: cargo xtask package --target ${{ matrix.target }}
      - name: Package macOS (bounded retry for busy DMG unmount)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        run: bash scripts/package-macos.sh "${{ matrix.target }}"
      - name: Verify every generated distribution file (REL-017)
        if: github.event_name != 'pull_request' || runner.os == 'Windows'
        run: cargo xtask verify-assets --assets target/dist/${{ matrix.target }} --target ${{ matrix.target }}
      - name: Silent install / uninstall, per user and all users (REL-014)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $setup = "target\dist\${{ matrix.target }}\Dockering-Setup-${{ matrix.arch }}.exe"
          pwsh -NoProfile -File scripts/installer-smoke.ps1 -Setup $setup -Version $version
          pwsh -NoProfile -File scripts/installer-smoke.ps1 -Setup $setup -Version $version -AllUsers
      - name: Collect binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p upload
          exe=dockering; [[ "$TARGET" == *windows* ]] && exe=dockering.exe
          cp "target/$TARGET/release/$exe" upload/
          if [[ -d "target/dist/$TARGET" ]]; then
            find "target/dist/$TARGET" -maxdepth 1 -type f -exec cp {} upload/ \;
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dockering-${{ matrix.target }}
          path: upload/
          retention-days: 14
          if-no-files-found: error
