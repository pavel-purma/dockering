# Engine root filesystems for "Set up Docker in WSL" (REL-088, REL-089, ENG-152, ENG-164).
#
# Builds the Alpine and the Ubuntu Docker root filesystems for x86_64 and aarch64 (a 2 x 2 matrix) with
# tools/engine-rootfs/build.sh, smoke-tests the two x86_64 images by importing them into WSL on the self-hosted
# `wsl` runner, and, only when a maintainer asks for it, publishes them as the GitHub release `rootfs-<n>`.
# The release is independent of the app releases (v*): the app pins each asset's URL, size and SHA-256
# (tools/engine-rootfs/pins.toml, crates/dk-wsl/src/setup/pins.rs), so a new image never reaches users
# until an app release carries the new pins.
#
# Triggers:
#   workflow_dispatch   inputs `tag` (rootfs-<n>) and `publish` (default false). A run without `publish` is a
#                       rehearsal: build and smoke test only, from any branch.
#   schedule            monthly rebuild for security updates and drift: builds and smoke-tests, NEVER publishes.
# Publishing: only `publish = true` from `main`, in the `release` environment, with a tag that has no release
# (published or draft) and no git tag yet. It creates a DRAFT, uploads the assets, compares every uploaded
# digest with the local file and only then publishes it, as a pre-release that is NOT the repository's Latest
# release (the in-app updater and the update tests read `releases/latest`). Created with GITHUB_TOKEN, the
# release starts no other workflow (linux-smoke, macos-smoke and winget listen for `release: published`).
# Agents never dispatch this workflow with `publish = true`; the maintainer does (docs/engine-rootfs.md).
#
# The arm64 images are BUILD ONLY: hosted runners cannot run WSL, so they are not smoke-tested.
# The smoke job runs on a self-hosted machine: like wsl-integration.yml, dispatch it only from refs you trust.
name: Engine rootfs
run-name: Engine rootfs (${{ inputs.tag || 'scheduled rebuild' }}${{ inputs.publish && ', publish' || '' }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build for and, with publish, to create (rootfs-<n>, for example rootfs-1)
        required: true
        type: string
      publish:
        description: Publish the assets as the release `rootfs-<n>` (main only; a release with this tag must not exist)
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "41 3 1 * *" # the 1st of each month, 03:41 UTC: builds and smoke-tests, never publishes

permissions:
  contents: read

# One run at a time: two builds must not race for the self-hosted runner, and one publish must never overlap another.
concurrency:
  group: engine-rootfs
  cancel-in-progress: false

env:
  PINS: tools/engine-rootfs/pins.py

jobs:
  prepare:
    name: check the inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: p
        name: Validate the tag and the publish request (REL-088)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          publish=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            tag=$REQUESTED_TAG
            if [[ "$REQUESTED_PUBLISH" == true ]]; then publish=true; fi
          else
            # A scheduled rebuild builds for the tag the pins currently name and never publishes.
            tag=$(python3 -B -I "$PINS" get release.tag)
          fi
          [[ $tag =~ ^rootfs-(0|[1-9][0-9]*)$ ]] || fail "the tag must look like rootfs-<n> (digits, no leading zero)"
          if [[ "$publish" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || fail "publishing is allowed from main only (this run is on $GITHUB_REF)"
            # A published rootfs release is never changed: the app pins its digests.
            existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -Fx -- "$tag" || true)
            [[ -z "$existing" ]] || fail "a release (maybe a draft) for $tag already exists; use the next number"
            refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref' | grep -Fx -- "refs/tags/$tag" || true)
            [[ -z "$refs" ]] || fail "the git tag $tag already exists; use the next number"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "::notice::tag $tag, publish=$publish"

  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A native runner per architecture: the image is assembled in a chroot, so no emulation is involved.
        include:
          - { image: alpine, arch: x86_64, os: ubuntu-24.04 }
          - { image: alpine, arch: aarch64, os: ubuntu-24.04-arm }
          - { image: ubuntu, arch: x86_64, os: ubuntu-24.04 }
          - { image: ubuntu, arch: aarch64, os: ubuntu-24.04-arm }
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      ENGINE_ROOTFS_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the root filesystem (REL-088)
        run: bash tools/engine-rootfs/build.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/out"
      - name: The asset, its checksum and its entry agree
        run: python3 -B -I "$PINS" verify "$RUNNER_TEMP/out" "$ENGINE_ROOTFS_TAG" --partial
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-rootfs-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
          retention-days: 7
          if-no-files-found: error

  # x86_64 only: the arm64 assets are build-only (no WSL on hosted runners, REL-088).
  smoke:
    name: smoke (${{ matrix.image }}, x86_64)
    needs: [prepare, build]
    runs-on: [self-hosted, windows, wsl]
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1 # one machine, one WSL, one Docker Desktop
      matrix:
        include:
          - { image: alpine, port: 18480 }
          - { image: ubuntu, port: 18481 }
    env:
      IMAGE: ${{ matrix.image }}
      PORT: ${{ matrix.port }}
      DISTRO: dockering-smoke-${{ github.run_id }}-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The `runner` context does not exist at job level, so the path is derived here for the later steps.
      - name: Work directory
        shell: pwsh
        run: |
          "WORKDIR=$env:RUNNER_TEMP\engine-rootfs-smoke-$env:GITHUB_RUN_ID-$env:IMAGE" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      # A re-run keeps the run id: remove what an earlier attempt of THIS run may have left (the name is unique to the run).
      - name: Remove leftovers of an earlier attempt
        shell: pwsh
        run: pwsh -NoProfile -File tools/engine-rootfs/smoke.ps1 -CleanupOnly -DistroName $env:DISTRO -WorkDir $env:WORKDIR
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-rootfs-${{ matrix.image }}-x86_64
          path: ${{ runner.temp }}\engine-rootfs-smoke-${{ github.run_id }}-${{ matrix.image }}\asset
      - name: Import, start dockerd, hello-world, published port, bind mount (REL-088, ENG-164)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:WORKDIR 'asset'
          $tar = Join-Path $asset "dockering-engine-$env:IMAGE-x86_64.tar.xz"
          # What the artifact transfer delivered is what the build produced.
          $expected = ((Get-Content -Raw -LiteralPath "$tar.sha256").Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $tar).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "the downloaded asset has SHA-256 $actual, the build recorded $expected" }
          pwsh -NoProfile -File tools/engine-rootfs/smoke.ps1 -Tar $tar -Image $env:IMAGE -DistroName $env:DISTRO -WorkDir $env:WORKDIR -Port ([int] $env:PORT)
          exit $LASTEXITCODE
      # The script unregisters in its own `finally`, but a cancelled job never reaches it.
      - name: Unregister the distro and delete the files
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File tools/engine-rootfs/smoke.ps1 -CleanupOnly -DistroName $env:DISTRO -WorkDir $env:WORKDIR

  publish:
    name: publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build, smoke]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # prepare checked this with a read-only token, which cannot see drafts: check again with the token that can.
      - name: The tag is unused (no release, draft or git tag)
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -Fx -- "$TAG" || true)
          [[ -z "$existing" ]] || { echo "::error::a release (maybe a draft) for $TAG already exists; use the next number"; exit 1; }
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref' | grep -Fx -- "refs/tags/$TAG" || true)
          [[ -z "$refs" ]] || { echo "::error::the git tag $TAG already exists; use the next number"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-rootfs-*
          path: artifacts
      - name: Collect the assets and check them against their entries
        run: |
          set -euo pipefail
          mkdir -p all dist
          while IFS= read -r -d '' f; do
            name=$(basename -- "$f")
            [[ ! -e "all/$name" ]] || { echo "::error::duplicate file $name"; exit 1; }
            cp -- "$f" "all/$name"
          done < <(find artifacts -type f -print0)
          # All four cells, each asset equal to its entry (name, size, SHA-256, url for this tag).
          python3 -B -I "$PINS" verify all "$TAG"
          # What the release carries: the images, their package manifests and licence notices, one checksum file.
          cp -- all/dockering-engine-*.tar.xz all/dockering-engine-*.manifest.txt all/LICENSES-*.txt dist/
          [[ "$(find dist -type f | wc -l)" -eq 12 ]] || { echo "::error::expected 12 release files"; ls dist; exit 1; }
          (cd dist && LC_ALL=C sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/SHA256SUMS
          python3 -B -I "$PINS" notes all "$TAG" > notes.md
          ls -l dist
      # Provenance for every file in the release (REL-013 style: public repositories only).
      - name: Build provenance
        if: github.event.repository.private != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # A draft first: nothing is public until every uploaded digest equals the local file. --latest=false and
      # --prerelease keep this release out of `releases/latest`, which the in-app updater reads (UPD-002).
      - name: Create the draft release and upload the assets
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Engine root filesystems $TAG" --notes-file notes.md
      - name: Every uploaded digest equals the local file
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          python3 -B -I "$PINS" check-uploaded dist release.json
      - name: Publish the release
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url --jq '.url'
      - name: The pins to commit
        run: |
          set -euo pipefail
          {
            echo "## $TAG is published"
            echo
            echo "Put this into \`tools/engine-rootfs/pins.toml\` and the same url, size and sha256 into \`crates/dk-wsl/src/setup/pins.rs\`, in one PR (docs/engine-rootfs.md):"
            echo
            echo '```toml'
            python3 -B -I "$PINS" render all "$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
