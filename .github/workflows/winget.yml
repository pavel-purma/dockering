# Submit every stable release to microsoft/winget-pkgs (REL-040, REL-041).
#
# Runs when a GitHub Release is published (pre-releases are skipped) or by hand for a given tag.
# The first version is submitted manually (packaging/winget/README.md); this workflow only updates
# the existing `Dockering.Dockering` package.
# Setup: fork microsoft/winget-pkgs under the maintainer's account, store a classic PAT with the
# `public_repo` scope as the secret WINGET_TOKEN, and set PUBLIC_RELEASES=true (signed channel) and WINGET_ENABLED=true.
name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: winget-pkgs PR
    if: vars.PUBLIC_RELEASES == 'true' && vars.WINGET_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: windows-latest
    steps:
      - name: Require a published signed stable release
        id: eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $text = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $text | ConvertFrom-Json
          # A .minisig only says the update manifest is signed (REL-083: it is also present on OS-unsigned
          # builds with UPDATER=all), so the installer's own Authenticode signature decides (REL-041).
          $signed = @($release.assets | Where-Object { $_.name -eq 'dockering-update.json.minisig' }).Count -eq 1
          if ($signed -and -not $release.isDraft -and -not $release.isPrerelease) {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'Dockering-Setup-x64.exe' --pattern 'Dockering-Setup-arm64.exe' --dir $env:RUNNER_TEMP --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($name in 'Dockering-Setup-x64.exe', 'Dockering-Setup-arm64.exe') {
              $status = (Get-AuthenticodeSignature -FilePath (Join-Path $env:RUNNER_TEMP $name)).Status
              if ($status -ne 'Valid') { Write-Host "::notice::$name Authenticode status is $status"; $signed = $false }
            }
          }
          if ($release.isDraft -or $release.isPrerelease -or -not $signed) {
            Write-Host '::notice::winget requires a published stable release with a signed update manifest and Authenticode-signed installers'
            'eligible=false' >> $env:GITHUB_OUTPUT
          } else {
            'eligible=true' >> $env:GITHUB_OUTPUT
          }
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: steps.eligibility.outputs.eligible == 'true'
        with:
          identifier: Dockering.Dockering
          installers-regex: 'Dockering-Setup-(x64|arm64)\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
