# Release automation with release-plz (REL-010, REL-011, REL-013). DORMANT: releases are cut with the
# `/release` skill (REL-018), and enabling the bot secrets next to it would open competing release PRs.
#
# `release-pr` opens or updates ONE release PR `chore(release): vX.Y.Z` on every push (version bump,
# Cargo.lock, CHANGELOG.md section). `release` runs on the same pushes but only acts when the push
# is the merge of a release PR (`release_always = false` in release-plz.toml): it creates the tag
# `vX.Y.Z`, which starts release.yml. release-plz never creates the GitHub Release itself.
#
# The release-bot GitHub App token is used instead of GITHUB_TOKEN so that the release PR runs CI
# and the tag push starts release.yml. App permissions: Contents + Pull requests read/write.
# Repository secrets (not an environment: GitHub Free can't use environments in private repos):
# RELEASE_BOT_APP_ID (the App ID or Client ID; both are accepted as `client-id`),
# RELEASE_BOT_PRIVATE_KEY.
# Without them, both jobs emit a notice and skip.
name: Release-plz

on:
  push:
    branches: [main, "release/*"]

# The release-bot App token does the writing; GITHUB_TOKEN needs nothing beyond read.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: release PR
    runs-on: ubuntu-24.04
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Mapped here so `if: env.X != ''` can gate steps.
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      - name: Release bot configured?
        if: env.RELEASE_BOT_APP_ID == ''
        run: echo "::notice::RELEASE_BOT_APP_ID is not set (repository secret); skipping the release PR."
      - name: Release bot token
        id: app
        if: env.RELEASE_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        if: env.RELEASE_BOT_APP_ID != ''
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        if: env.RELEASE_BOT_APP_ID != ''
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: release-plz release-pr
        if: env.RELEASE_BOT_APP_ID != ''
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  release:
    name: release (tag)
    runs-on: ubuntu-24.04
    env:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      - name: Release bot configured?
        if: env.RELEASE_BOT_APP_ID == ''
        run: echo "::notice::RELEASE_BOT_APP_ID is not set (repository secret); skipping the release."
      - name: Release bot token
        id: app
        if: env.RELEASE_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        if: env.RELEASE_BOT_APP_ID != ''
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        if: env.RELEASE_BOT_APP_ID != ''
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: release-plz release
        if: env.RELEASE_BOT_APP_ID != ''
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
