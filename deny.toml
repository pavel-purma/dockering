# REL-003: licenses not listed here are rejected. GPL-family licenses are
# intentionally absent and therefore fail the license check.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories are checked on every CI run (`cargo deny check`).
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
# Keep non-project-wide allowances narrow and document why each crate needs it.
exceptions = [
  # unicode-ident retains this legacy Unicode data-files license alongside MIT/Apache.
  { crate = "unicode-ident", allow = ["Unicode-DFS-2016"] },
  # ring includes portions under the OpenSSL license; do not allow it globally.
  { crate = "ring", allow = ["OpenSSL"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `{ path = ... }` deps are unpublished (publish = false).
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "terminal", reason = "Zed terminal code is GPL; Dockering uses alacritty_terminal." },
  { crate = "terminal_view", reason = "Zed terminal_view is GPL and must remain reference-only." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
