# REL-003: licenses not listed here are rejected. GPL-family licenses are
# intentionally absent and therefore fail the license check.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories are checked on every CI run (`cargo deny check`).
# Vulnerabilities always fail. The ignores below are *unmaintained* notices for
# crates we only get transitively through the exactly pinned `gpui-kit` 0.7 and
# cannot replace ourselves. Re-check them on every gpui-kit upgrade PR; cargo-deny
# warns (advisory-not-detected) once an ignore becomes stale so it can be removed.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, transitive via gpui-base (gpui-kit 0.7)" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, transitive via gpui-component and metal (gpui-kit 0.7)" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via fontdb/usvg/cosmic-text (gpui-kit 0.7)" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, transitive via usvg/resvg (gpui-kit 0.7)" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
# Keep non-project-wide allowances narrow and document why each crate needs it.
# Only permissive licences may appear here; GPL/AGPL/LGPL must never be excepted.
exceptions = [
  # 0BSD is a public-domain-equivalent permissive licence; transitive via gpui-component (gpui-kit 0.7).
  { crate = "enum-iterator", allow = ["0BSD"] },
  { crate = "enum-iterator-derive", allow = ["0BSD"] },
  # Permissive BSD-style bzip2 licence; pure-Rust libbzip2 port, transitive via gpui's http client (async-compression).
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `{ path = ... }` deps are unpublished (publish = false).
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "terminal", reason = "Zed terminal code is GPL; Dockering uses alacritty_terminal." },
  { crate = "terminal_view", reason = "Zed terminal_view is GPL and must remain reference-only." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
